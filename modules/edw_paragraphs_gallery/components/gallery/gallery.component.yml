$schema: https://git.drupalcode.org/project/drupal/-/raw/10.1.x/core/modules/sdc/src/metadata.schema.json
name: Gallery Component
status: experimental
description: 'A gallery component that can be used to display a collection of images in a visually appealing way. It supports various layout options and can be easily customized to fit the design of your website.'
libraries:
  - edw_paragraphs_gallery/light_gallery

# Props.
props:
  type: object
  properties:
    # uc -> utility_classes
    gallery_uc:
      type: ['array', 'null']
      items:
        type: string
      title: Gallery Utility Classes
      description: An array of utility classes. Use to add extra classes or custom CSS classes over to this component.
      default: []

    # att -> attributes
    gallery_att:
      type: Drupal\Core\Template\Attribute
      title: Gallery Attributes
      description: A list of HTML attributes for the gallery component.

# Slots.
slots:
  slot_content:
    title: Content
    description: A slot for rendering the gallery content, such as images or other media items.
